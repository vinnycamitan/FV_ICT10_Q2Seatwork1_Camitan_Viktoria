
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Registration</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: linear-gradient(
                rgba(0, 0, 0, 0.5),
                rgba(0, 0, 0, 0.5)
            ), url("https://media1.tenor.com/m/RKyKfvm6r6sAAAAd/frutiger-aero.gif");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            width: 320px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #00ff62;
            margin-bottom: 10px;
        }

        p {
            font-family: 'Rajdhani', sans-serif;
            color: #526579;
            font-size: 17px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccd5df;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background-color: #00ff66;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        button:hover {
            background-color: #00fffb;
        }

        #result {
            margin-top: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ICT CLUB</h1>
        <p>Check if your name is on the club members list.</p>

        <input type="text" id="first_name" placeholder="First Name">
        <input type="text" id="last_name" placeholder="Last Name">

        <button py-click="check_name">Check Membership</button>

        <div id="result"></div>
    </div>

    <script type="py" src="./main.py"></script>
</body>
</html>
